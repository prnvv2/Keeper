[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "keeper-control-plane"
version = "0.1.0"
description = "Control plane for the Keeper AI firewall: telemetry ingestion, audit search, policy distribution, alerting, and SIEM export."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"

dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "sqlalchemy>=2.0",
  "httpx>=0.27",
  # The control plane parses and validates the same policy documents the SDK
  # enforces. Depending on the SDK rather than reimplementing the parser is
  # what guarantees a bundle that publishes here will load out there.
  "keeper-firewall>=0.1.0",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.1"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "httpx>=0.27", "ruff>=0.5", "mypy>=1.10"]

[project.scripts]
keeper-control-plane = "keeper_control.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["keeper_control"]

[tool.uv.sources]
keeper-firewall = { path = "../sdk/python", editable = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "C4", "SIM", "RUF"]
ignore = ["E501", "B008"]
